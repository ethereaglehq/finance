services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finlex
      POSTGRES_USER: finlex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finlex -d finlex"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      FINLEX_DATABASE_URL: postgresql+psycopg://finlex:${POSTGRES_PASSWORD:-change-me}@db:5432/finlex
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
